name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Bundle Windows yt-dlp binary
        working-directory: desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"

      - name: Sync package version with tag
        if: github.ref_type == 'tag'
        working-directory: desktop
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match "^v?(\d+\.\d+\.\d+.*)$") {
            $tagVer = $matches[1]
            $pkg = Get-Content package.json | ConvertFrom-Json
            if ($pkg.version -ne $tagVer) {
              Write-Host "Syncing package.json version from $($pkg.version) to $tagVer"
              $pkg.version = $tagVer
              $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json
            }
          }

      - name: Build OpenTune Windows Installer & Portable
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: List generated Windows build artifacts
        working-directory: desktop
        shell: pwsh
        run: Get-ChildItem dist\

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenTune-Windows-EXE
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error

      - name: Determine release tag
        id: release_tag
        working-directory: desktop
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}") {
            $tag = "${{ github.ref_name }}"
          } else {
            $ver = (Get-Content package.json | ConvertFrom-Json).version
            $tag = "v$ver"
          }
          Write-Host "Target GitHub release tag: $tag"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Attach Windows EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          files: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

