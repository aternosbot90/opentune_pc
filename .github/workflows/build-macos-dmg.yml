name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Bundle macOS universal yt-dlp binary
        working-directory: desktop
        run: |
          mkdir -p bin
          rm -f bin/yt-dlp.exe
          curl -fL "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" -o bin/yt-dlp_macos
          chmod +x bin/yt-dlp_macos

      - name: Sync package version with tag
        if: github.ref_type == 'tag'
        working-directory: desktop
        run: |
          TAG="${{ github.ref_name }}"
          CLEAN_VER=$(echo "$TAG" | sed -E 's/^v//')
          if [ -n "$CLEAN_VER" ]; then
            node -e "const fs = require('fs'); const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); if (p.version !== '$CLEAN_VER') { console.log('Syncing package.json version from ' + p.version + ' to $CLEAN_VER'); p.version = '$CLEAN_VER'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2)); }"
          fi

      - name: Build OpenTune macOS Universal DMG
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:mac

      - name: List generated macOS build artifacts
        working-directory: desktop
        run: ls -lh dist/

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenTune-macOS-DMG
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml
          if-no-files-found: error

      - name: Determine release tag
        id: release_tag
        working-directory: desktop
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] && [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(node -p "require('./package.json').version")
            TAG="v$VER"
          fi
          echo "Target GitHub release tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Attach macOS DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

